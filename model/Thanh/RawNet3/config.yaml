# RawNet3 training and evaluation configuration.
#
# The paths below are examples for Kaggle. Override them with a copied config
# or command-line arguments in the future; do not commit datasets or weights.

project:
  name: rawnet3_speaker_recognition
  seed: 42

dataset:
  # Each manifest row must contain: path,speaker_id
  train_manifest: /kaggle/input/speaker-data/manifests/train.csv
  validation_manifest: /kaggle/input/speaker-data/manifests/validation.csv
  # Each pair row must contain: enrollment_path,test_path,label
  test_pairs: /kaggle/input/speaker-data/manifests/test_pairs.csv
  path_column: path
  speaker_column: speaker_id
  enrollment_path_column: enrollment_path
  test_path_column: test_path
  label_column: label

audio:
  sample_rate: 16000
  duration_seconds: 3.0
  random_crop_training: true
  peak_normalize: false

model:
  embedding_dim: 192
  base_channels: 64
  am_scale: 30.0
  am_margin: 0.20

training:
  batch_size: 16
  epochs: 20
  learning_rate: 0.0001
  weight_decay: 0.00001
  gradient_accumulation_steps: 1
  gradient_clip_norm: 5.0
  mixed_precision: fp16
  use_amp: true

runtime:
  # Kaggle's GPU notebook should set this to cuda automatically.
  device: cuda
  kaggle_gpu: true
  require_cuda: true
  num_workers: 2
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 1
  drop_last: true

outputs:
  metrics_json: ../results/rawnet3_metrics.json
  metrics_csv: ../results/rawnet3_metrics.csv
  checkpoint_directory: ../checkpoints/rawnet3
